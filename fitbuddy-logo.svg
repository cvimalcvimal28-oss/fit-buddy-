<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">FitBuddy</title>
  <desc id="desc">A gold eagle and barbell emblem beside the FitBuddy fitness wordmark.</desc>
